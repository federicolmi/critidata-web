<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/anestesia-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CritiData Anestesia — parte anestésico digital y monitoreo en vivo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CritiData Anestesia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CritiData Anestesia</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* La pantalla de carga, igual a la de nefro y gastro (2-nov-2026, "que
       queden iguales"): antes la app quedaba en blanco hasta el primer
       cuadro de Flutter. pointer-events none y el respaldo de 30 s: aunque
       el evento no llegara, nunca tapa la app. */
    #cargando {
      position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      display: flex; flex-direction: column; gap: 28px;
      align-items: center; justify-content: center;
      background: #0D1B3E; color: rgba(255,255,255,0.5);
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px;
      letter-spacing: 1px;
      transition: opacity 0.4s ease;
    }
    #cargando.oculto { opacity: 0; }
    #cargando .aro {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.7);
      animation: girar 0.8s linear infinite;
    }
    @keyframes girar { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="cargando"><div class="aro"></div><div>CritiData Anestesia</div></div>
  <script>
    (function () {
      function sacar() {
        var s = document.getElementById('cargando');
        if (!s) return;
        s.classList.add('oculto');
        setTimeout(function () { s.remove(); }, 400);
      }
      window.addEventListener('flutter-first-frame', sacar);
      setTimeout(sacar, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20261113112440-0b46ceb" async></script>
</body>
</html>
